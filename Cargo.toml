[package]
name = "backup-buddies-client"
version = "0.10.1"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Spencer LeBlanc"]
repository = "https://github.com/mspencerl87/backup-buddies-client"
description = "Backup Buddies client: encrypted peer-to-peer backups to a buddy's device"
# Pinned to iroh 1.3.0 to match deploy/relay's iroh-relay:v1.3.0 image —
# client and relay protocol versions should move together. Verified to
# compile cleanly against this exact dependency set as of 2026-10-01; iroh's
# API has shifted release to release (NodeId/NodeAddr renamed to
# EndpointId/EndpointAddr at some point before 1.3.0), so re-check this
# against the current `iroh` docs.rs page before bumping the version.

[dependencies]
age = "0.12.1"
# Only for the Stanza/FileKey types in crypto.rs's lazily derived old key
# (age doesn't re-export them). Same version age itself uses.
age-core = "0.12"
anyhow = "1.0.104"
# Local status/restore dashboard (dashboard.rs) — plain axum, no templating
# engine; the one page it serves is a small embedded HTML/JS string.
axum = "0.7"
# Physical free/total space for the filesystem under DATA_DIR, shown on
# the dashboard next to what's been pledged — plain std::fs has no
# portable way to ask the OS this. Default "sync" feature only; we call it
# from a blocking context (see dashboard.rs's disk_stats).
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
# Exclude-list patterns (src/excludes.rs): ripgrep's glob matcher, which
# already handles `*` vs `**`, `{a,b}` and case-insensitive matching.
globset = "0.4"
hex = "0.4.3"
# Same versions age itself uses — derive the long-term file key from the
# passphrase once (see src/crypto.rs) instead of per file.
bech32 = "0.11"
scrypt = { version = "0.11", default-features = false }
# The on-disk index (src/index.rs). "bundled" compiles SQLite in, so
# there's nothing extra to install in the image.
rusqlite = { version = "0.40", features = ["bundled"] }
iroh = "1.3.0"
iroh-mdns-address-lookup = "0.6.0"
n0-future = "0.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
